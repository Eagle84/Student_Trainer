<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Architecture: two registries feed a pure core, which a thin UI layer renders">
  <rect width="1200" height="520" rx="18" fill="#0b1a2b"/>

  <text x="600" y="42" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700"
        fill="#e6eef8" text-anchor="middle">Two registries, a pure core, a thin shell</text>
  <text x="600" y="68" font-family="Segoe UI, sans-serif" font-size="13" fill="#8fa6c0" text-anchor="middle">
    Adding a subject means one module and one registry entry. Nothing else changes.
  </text>

  <!-- ================= CONTENT ================= -->
  <g transform="translate(40 104)">
    <rect width="330" height="360" rx="14" fill="#0f2033" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">CONTENT</text>
    <text x="20" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0">pure data + pure functions</text>

    <g font-family="ui-monospace, Consolas, monospace" font-size="12">
      <rect x="20" y="68" width="290" height="34" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="90" fill="#e6eef8">js/subjects/index.js</text>
      <text x="296" y="90" fill="#2dd4bf" text-anchor="end" font-size="10">registry</text>

      <rect x="20" y="110" width="290" height="112" rx="8" fill="#0c1c2e" stroke="#24425f"/>
      <text x="34" y="130" fill="#8fa6c0" font-size="11">math · english · hebrew</text>
      <text x="34" y="150" fill="#8fa6c0" font-size="11">psychometric · psychotechnical</text>
      <text x="34" y="170" fill="#8fa6c0" font-size="11">reliability · writing</text>
      <text x="34" y="196" fill="#a78bfa" font-size="10">(level) =&gt; { topic, text, options, exp }</text>
      <text x="34" y="212" fill="#a78bfa" font-size="10">optional: diagram, optionDiagrams</text>

      <rect x="20" y="234" width="290" height="34" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="256" fill="#e6eef8">js/lessons/index.js</text>
      <text x="296" y="256" fill="#2dd4bf" text-anchor="end" font-size="10">registry</text>

      <rect x="20" y="276" width="290" height="66" rx="8" fill="#0c1c2e" stroke="#24425f"/>
      <text x="34" y="296" fill="#8fa6c0" font-size="11">163 lessons, keyed by the SAME</text>
      <text x="34" y="314" fill="#8fa6c0" font-size="11">topic strings the generators emit</text>
      <text x="34" y="332" fill="#f0b429" font-size="10">that shared key is the whole design</text>
    </g>
  </g>

  <!-- ================= CORE ================= -->
  <g transform="translate(430 104)">
    <rect width="330" height="360" rx="14" fill="#0f2033" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#22d3ee">CORE</text>
    <text x="20" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0">no DOM, no network — all 188 tests live here</text>

    <g font-family="ui-monospace, Consolas, monospace" font-size="12">
      <rect x="20" y="68" width="290" height="44" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="88" fill="#e6eef8">js/quiz.js</text>
      <text x="34" y="104" fill="#8fa6c0" font-size="10">assemble · shuffle · score</text>

      <rect x="20" y="122" width="290" height="44" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="142" fill="#e6eef8">js/lesson.js</text>
      <text x="34" y="158" fill="#8fa6c0" font-size="10">a state machine: cards, steps, progress</text>

      <rect x="20" y="176" width="290" height="44" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="196" fill="#e6eef8">js/visuals.js · js/diagrams.js</text>
      <text x="34" y="212" fill="#8fa6c0" font-size="10">SVG strings, presentation attrs only</text>

      <rect x="20" y="230" width="290" height="44" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="250" fill="#e6eef8">js/analytics.js · js/qtypes.js</text>
      <text x="34" y="266" fill="#8fa6c0" font-size="10">weak topics · answer shapes</text>

      <rect x="20" y="290" width="290" height="52" rx="8" fill="#0c1c2e" stroke="#f0b429" stroke-dasharray="5 4"/>
      <text x="34" y="310" fill="#f0b429" font-size="10">CSP: style-src 'self'</text>
      <text x="34" y="328" fill="#8fa6c0" font-size="10">no style="" in generated SVG — tested</text>
    </g>
  </g>

  <!-- ================= SHELL ================= -->
  <g transform="translate(820 104)">
    <rect width="340" height="360" rx="14" fill="#0f2033" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#a78bfa">SHELL</text>
    <text x="20" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0">DOM + network — verified in a browser</text>

    <g font-family="ui-monospace, Consolas, monospace" font-size="12">
      <rect x="20" y="68" width="300" height="40" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="93" fill="#e6eef8">js/app.js</text>
      <text x="306" y="93" fill="#8fa6c0" text-anchor="end" font-size="10">one click listener</text>

      <rect x="20" y="118" width="300" height="40" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="143" fill="#e6eef8">js/ui.js</text>
      <text x="306" y="143" fill="#8fa6c0" text-anchor="end" font-size="10">quiz + board screens</text>

      <rect x="20" y="168" width="300" height="40" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="193" fill="#e6eef8">js/ui-lesson.js · ui-drawer.js</text>
      <text x="306" y="193" fill="#8fa6c0" text-anchor="end" font-size="10">study screens</text>

      <rect x="20" y="218" width="300" height="40" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="243" fill="#e6eef8">js/sanitize.js</text>
      <text x="306" y="243" fill="#8fa6c0" text-anchor="end" font-size="10">DOMPurify, SRI-pinned</text>

      <rect x="20" y="272" width="300" height="70" rx="8" fill="#12263c" stroke="#24425f"/>
      <text x="34" y="294" fill="#e6eef8">js/db.js</text>
      <text x="34" y="312" fill="#8fa6c0" font-size="10">Supabase + a localStorage queue:</text>
      <text x="34" y="330" fill="#8fa6c0" font-size="10">offline results sync when the net returns</text>
    </g>
  </g>

  <!-- flow arrows -->
  <g stroke="#8fa6c0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M374 284 L424 284"/>
    <path d="M764 284 L814 284"/>
  </g>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8fa6c0"/>
    </marker>
  </defs>

  <text x="600" y="496" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0" text-anchor="middle">
    Supabase Postgres · row-level security · zero npm dependencies · no build step
  </text>
</svg>
