<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Three screens: the home cards, a lesson page, and a quiz with picture answers">
  <defs>
    <linearGradient id="b2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#0b1a2b"/>

  <!-- ============ 1. HOME ============ -->
  <g transform="translate(28 26)">
    <rect width="360" height="418" rx="14" fill="#0f2033" stroke="#24425f" stroke-width="1.5"/>
    <text x="340" y="30" font-family="Segoe UI, sans-serif" font-size="13" fill="#8fa6c0"
          text-anchor="end">מסך הבית</text>

    <!-- study card -->
    <g transform="translate(18 48)">
      <rect width="324" height="86" rx="12" fill="#12263c" stroke="#2dd4bf" stroke-width="1.5"/>
      <rect x="322" y="0" width="2" height="86" fill="#2dd4bf"/>
      <text x="300" y="32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700"
            fill="#7dc4f0" text-anchor="end">ללמוד נושא</text>
      <text x="300" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">הסבר מונחה עם דוגמאות</text>
      <text x="300" y="74" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">ואז אפשר להיבחן עליו</text>
      <text x="30" y="50" font-size="22" text-anchor="middle">📖</text>
    </g>

    <!-- quiz card -->
    <g transform="translate(18 146)">
      <rect width="324" height="86" rx="12" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
      <text x="300" y="32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700"
            fill="#7dc4f0" text-anchor="end">להיבחן</text>
      <text x="300" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">מבחן מותאם עם משוב מיידי</text>
      <text x="300" y="74" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">ופירוט טעויות</text>
      <text x="30" y="50" font-size="22" text-anchor="middle">📝</text>
    </g>

    <!-- extra subjects card -->
    <g transform="translate(18 244)">
      <rect width="324" height="86" rx="12" fill="#12263c" stroke="#a78bfa" stroke-width="1.5"/>
      <rect x="322" y="0" width="2" height="86" fill="#a78bfa"/>
      <text x="300" y="32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700"
            fill="#c4b5fd" text-anchor="end">מקצועות נוספים</text>
      <text x="300" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">פסיכומטרי · פסיכוטכני</text>
      <text x="300" y="74" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">אמינות · מטלת הכתיבה</text>
      <text x="30" y="50" font-size="22" text-anchor="middle">🎓</text>
    </g>

    <!-- progress ring -->
    <g transform="translate(18 342)">
      <rect width="324" height="58" rx="12" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
      <circle cx="42" cy="29" r="19" fill="none" stroke="#24425f" stroke-width="5"/>
      <path d="M42 10 A19 19 0 0 1 55.4 42.4" fill="none" stroke="url(#b2)" stroke-width="5" stroke-linecap="round"/>
      <text x="42" y="34" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700"
            fill="#e6eef8" text-anchor="middle">19%</text>
      <text x="300" y="26" font-family="Segoe UI, sans-serif" font-size="12" fill="#8fa6c0"
            text-anchor="end">ההתקדמות שלך — מתמטיקה · כיתה ה׳</text>
      <text x="300" y="45" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700"
            fill="#2dd4bf" text-anchor="end">1 / 8</text>
    </g>
  </g>

  <!-- ============ 2. LESSON ============ -->
  <g transform="translate(420 26)">
    <rect width="360" height="418" rx="14" fill="#0f2033" stroke="#24425f" stroke-width="1.5"/>
    <text x="340" y="30" font-family="Segoe UI, sans-serif" font-size="13" fill="#8fa6c0"
          text-anchor="end">שיעור</text>

    <!-- progress dots -->
    <g transform="translate(0 44)">
      <circle cx="300" cy="0" r="5" fill="#2dd4bf"/><circle cx="282" cy="0" r="5" fill="#2dd4bf"/>
      <circle cx="264" cy="0" r="5" fill="#22d3ee"/><circle cx="246" cy="0" r="5" fill="#24425f"/>
      <circle cx="228" cy="0" r="5" fill="#24425f"/>
      <text x="60" y="4" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0">3 / 5</text>
    </g>

    <text x="340" y="82" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700"
          fill="#e6eef8" text-anchor="end">נפתור יחד</text>

    <!-- the balance visual -->
    <g transform="translate(96 100)">
      <line x1="12" y1="26" x2="156" y2="26" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
      <circle cx="84" cy="26" r="4" fill="#2dd4bf"/>
      <polygon points="84,26 68,72 100,72" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
      <rect x="0" y="36" width="52" height="22" rx="5" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
      <text x="26" y="51" font-family="monospace" font-size="12" fill="#e6eef8" text-anchor="middle">3x+5</text>
      <rect x="116" y="36" width="52" height="22" rx="5" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
      <text x="142" y="51" font-family="monospace" font-size="12" fill="#e6eef8" text-anchor="middle">20</text>
    </g>

    <!-- revealed steps -->
    <g transform="translate(18 190)">
      <text x="322" y="12" font-family="Segoe UI, sans-serif" font-size="12" fill="#cfe0f5"
            text-anchor="end">1 · המטרה: לבודד את x.</text>
      <text x="322" y="42" font-family="Segoe UI, sans-serif" font-size="12" fill="#cfe0f5"
            text-anchor="end">2 · מחסרים 5 משני האגפים.</text>
      <rect x="196" y="52" width="126" height="24" rx="6" fill="#0c1c2e" stroke="#24425f" stroke-width="1"/>
      <text x="259" y="68" font-family="monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">3x = 15</text>
      <!-- the newest step, mid-animation -->
      <text x="322" y="100" font-family="Segoe UI, sans-serif" font-size="12" fill="#e6eef8"
            text-anchor="end">3 · מחלקים ב-3.</text>
      <rect x="196" y="110" width="126" height="24" rx="6" fill="#0f3b38" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="259" y="126" font-family="monospace" font-size="12" fill="#2dd4bf" text-anchor="middle">x = 5</text>
    </g>

    <g transform="translate(18 344)">
      <rect width="324" height="34" rx="9" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
      <text x="162" y="22" font-family="Segoe UI, sans-serif" font-size="12" fill="#7dc4f0"
            text-anchor="middle">הצעד הבא · נותרו 2</text>
    </g>
    <g transform="translate(18 386)">
      <rect width="324" height="16" rx="8" fill="#0c1c2e"/>
      <text x="162" y="12" font-family="Segoe UI, sans-serif" font-size="9" fill="#8fa6c0"
            text-anchor="middle">כל צעד נפתח בנפרד, בלי לרענן את הכרטיס</text>
    </g>
  </g>

  <!-- ============ 3. QUIZ with picture answers ============ -->
  <g transform="translate(812 26)">
    <rect width="360" height="418" rx="14" fill="#0f2033" stroke="#24425f" stroke-width="1.5"/>
    <text x="340" y="30" font-family="Segoe UI, sans-serif" font-size="13" fill="#8fa6c0"
          text-anchor="end">מבחן · פסיכוטכני</text>

    <text x="340" y="60" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700"
          fill="#e6eef8" text-anchor="end">איזו צורה משלימה את הסדרה?</text>

    <!-- the series prompt -->
    <g transform="translate(30 78)">
      <g fill="none" stroke="#24425f" stroke-width="1.5">
        <rect x="0" y="0" width="66" height="66" rx="7"/>
        <rect x="78" y="0" width="66" height="66" rx="7"/>
        <rect x="156" y="0" width="66" height="66" rx="7"/>
      </g>
      <rect x="234" y="0" width="66" height="66" rx="7" fill="none" stroke="#2dd4bf"
            stroke-width="2.5" stroke-dasharray="6 4"/>
      <g fill="none" stroke="#2dd4bf" stroke-width="2.5">
        <rect x="15" y="15" width="36" height="36"/>
        <rect x="93" y="15" width="36" height="36"/>
        <rect x="171" y="15" width="36" height="36"/>
      </g>
      <g fill="#2dd4bf">
        <circle cx="33" cy="33" r="3"/>
        <circle cx="103" cy="23" r="3"/><circle cx="119" cy="43" r="3"/>
        <circle cx="181" cy="23" r="3"/><circle cx="197" cy="23" r="3"/><circle cx="181" cy="43" r="3"/>
      </g>
      <text x="267" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700"
            fill="#2dd4bf" text-anchor="middle">?</text>
    </g>

    <!-- four picture answers -->
    <g transform="translate(30 168)">
      <g>
        <rect x="0" y="0" width="140" height="96" rx="9" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
        <rect x="52" y="16" width="36" height="36" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
        <circle cx="62" cy="26" r="3" fill="#2dd4bf"/><circle cx="78" cy="26" r="3" fill="#2dd4bf"/>
        <circle cx="78" cy="42" r="3" fill="#2dd4bf"/><circle cx="62" cy="42" r="3" fill="#2dd4bf"/>
        <text x="70" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0"
              text-anchor="middle">צורה א</text>
      </g>
      <g transform="translate(160 0)">
        <rect x="0" y="0" width="140" height="96" rx="9" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
        <circle cx="70" cy="34" r="19" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
        <circle cx="62" cy="26" r="3" fill="#2dd4bf"/>
        <text x="70" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0"
              text-anchor="middle">צורה ב</text>
      </g>
      <g transform="translate(0 108)">
        <rect x="0" y="0" width="140" height="96" rx="9" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
        <rect x="52" y="16" width="36" height="36" fill="rgba(13,148,136,0.28)" stroke="#2dd4bf" stroke-width="2.5"/>
        <text x="70" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0"
              text-anchor="middle">צורה ג</text>
      </g>
      <g transform="translate(160 108)">
        <rect x="0" y="0" width="140" height="96" rx="9" fill="#12263c" stroke="#24425f" stroke-width="1.5"/>
        <polygon points="70,15 90,52 50,52" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
        <circle cx="62" cy="42" r="3" fill="#2dd4bf"/><circle cx="78" cy="42" r="3" fill="#2dd4bf"/>
        <text x="70" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#8fa6c0"
              text-anchor="middle">צורה ד</text>
      </g>
    </g>

    <text x="180" y="400" font-family="Segoe UI, sans-serif" font-size="10" fill="#8fa6c0"
          text-anchor="middle">כשהתשובה היא תמונה, האפשרויות מצוירות</text>
  </g>
</svg>
